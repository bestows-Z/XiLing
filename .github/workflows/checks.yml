name: Godot checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fsSL --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fsSL --retry 3 "$base/SHA512-SUMS.txt" -o /tmp/SHA512-SUMS.txt
          mv /tmp/godot.zip /tmp/Godot_v4.7.2-stable_linux.x86_64.zip
          (cd /tmp && sha512sum --check --ignore-missing SHA512-SUMS.txt)
          unzip -q /tmp/Godot_v4.7.2-stable_linux.x86_64.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Audit tracked product files
        run: python3 tools/repository_check.py
      - name: Import, parse and test without optional original artwork
        run: python3 tools/check.py
